name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      # The site is served at https://chris.dilger.me by a Cloudflare Worker that proxies to this Pages site,
      # so it is always built for the domain root, whatever path Pages itself serves it from.
      # Until Pages is enabled (Settings > Pages > Source: GitHub Actions) configure-pages fails; we still build to verify.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - run: npm run build
        env:
          SITE: https://chris.dilger.me
          BASE: /
      - if: steps.pages.outcome != 'success'
        run: echo "::notice::Built OK. Not deploying because GitHub Pages is not enabled for this repo (Settings > Pages > Source - GitHub Actions)."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
