# Hosting is Cloudflare Pages (project chris-dilger-me), which builds every push itself:
#   main -> preview.chris.dilger.me   (shared test site)
#   prod -> chris.dilger.me           (production; move it with the "Promote to production" workflow)
# This workflow only checks that the site still builds, so a broken push shows up red on GitHub.
name: Site build check
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site-check.yml']
  pull_request:
    paths: ['site/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run build
        env: { SITE: 'https://chris.dilger.me', BASE: / }
